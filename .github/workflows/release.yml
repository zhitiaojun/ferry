name: Build and Release Ferry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Go Vet & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm GOARM=7 go vet ./core/... ./cmd/ferry ./cmd/ft-server
      - run: go test -count=1 ./...

  build-windows:
    name: Build Windows (CLI / Desktop / Setup)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLI, Desktop GUI, ShellMenu and Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Compress-GzipFile([string]$src, [string]$dst) {
            $in = [System.IO.File]::OpenRead($src)
            try {
              $out = [System.IO.File]::Create($dst)
              try {
                $gz = [System.IO.Compression.GZipStream]::new($out, [System.IO.Compression.CompressionLevel]::Optimal)
                try {
                  $in.CopyTo($gz)
                } finally {
                  $gz.Dispose()
                }
              } finally {
                $out.Dispose()
              }
            } finally {
              $in.Dispose()
            }
          }

          New-Item -ItemType Directory -Force -Path out/windows, cmd/ft-setup/payload/menu/Assets | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue cmd/ft-setup/payload/*.exe, cmd/ft-setup/payload/*.gz, cmd/ft-setup/payload/menu/*.dll, cmd/ft-setup/payload/menu/*.exe, cmd/ft-setup/payload/menu/*.gz
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "1.0.0-dev" }

          go build -trimpath -ldflags="-s -w -X main.version=$ver" -o out/windows/ferry-windows-amd64.exe ./cmd/ferry
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$ver" -o out/windows/ferry-desktop-windows-amd64.exe ./cmd/ft-desktop
          go build -trimpath -ldflags="-s -w" -o out/windows/ftstub.exe ./cmd/ft-msix-stub

          $cc = ""
          if (Test-Path "C:\msys64\mingw64\bin\gcc.exe") {
            $cc = "C:\msys64\mingw64\bin\gcc.exe"
          } elseif ($c = Get-Command gcc,clang -ErrorAction SilentlyContinue | Select-Object -First 1) {
            $cc = $c.Source
          } else {
            throw "No MinGW C compiler found to build ftmenu.dll"
          }
          & $cc -shared -O2 -s -o out/windows/ftmenu.dll cmd/ft-shellmenu/ftmenu.c cmd/ft-shellmenu/ftmenu.def "-Wl,--exclude-all-symbols" -lole32 -luuid -lshell32 -ladvapi32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-GzipFile out/windows/ferry-windows-amd64.exe cmd/ft-setup/payload/ferry.exe.gz
          Compress-GzipFile out/windows/ferry-desktop-windows-amd64.exe cmd/ft-setup/payload/ferry-desktop.exe.gz
          Compress-GzipFile out/windows/ftstub.exe cmd/ft-setup/payload/menu/ftstub.exe.gz
          Compress-GzipFile out/windows/ftmenu.dll cmd/ft-setup/payload/menu/ftmenu.dll.gz
          Copy-Item deploy/msix/AppxManifest.xml cmd/ft-setup/payload/menu/ -Force
          Copy-Item deploy/msix/ft.ico cmd/ft-setup/payload/menu/ -Force
          Copy-Item deploy/msix/Assets/*.png cmd/ft-setup/payload/menu/Assets/ -Force

          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$ver" -o out/windows/ferry-setup-windows-amd64.exe ./cmd/ft-setup
          go vet ./...
          go test -count=1 ./cmd/ferry ./cmd/ft-desktop ./cmd/ft-setup
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: out/windows/ferry-setup-windows-amd64.exe

  build-linux:
    name: Build Linux (CLI / Relay Server)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Linux amd64 binaries
        run: |
          mkdir -p out/linux
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "main" ]; then VER="1.0.0-dev"; fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VER" -o out/linux/ferry-linux-amd64 ./cmd/ferry
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VER" -o out/linux/ferry-server-linux-amd64 ./cmd/ft-server
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: out/linux/*

  build-android:
    name: Build Android APKs (arm64-v8a / armeabi-v7a)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 34 & NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR=""
          for p in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMGR="$p"; break; fi
          done
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)
          fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install gomobile & gobind
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          PATH="$(go env GOPATH)/bin:$PATH" gomobile init
      - name: Build and Sign Android APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          SDK="$ANDROID_HOME"
          BT="$SDK/build-tools/34.0.0"
          AJAR="$SDK/platforms/android-34/android.jar"
          WORK="/tmp/ferry-android"
          OUT="out/android"
          VER_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VER_NAME" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            VER_NAME="1.0.0"
          fi

          mkdir -p "$OUT" "$WORK/aar" "$WORK/classes" "$WORK/dex"
          CGO_LDFLAGS="${CGO_LDFLAGS:+$CGO_LDFLAGS }-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" \
            gomobile bind -target=android/arm64 -androidapi 21 -ldflags="-s -w -X github.com/zhitiaojun/ferry/core/mobile.Version=${VER_NAME}" -o "$WORK/ft-arm64.aar" ./core/mobile
          gomobile bind -target=android/arm -androidapi 21 -ldflags="-s -w -X github.com/zhitiaojun/ferry/core/mobile.Version=${VER_NAME}" -o "$WORK/ft-armv7a.aar" ./core/mobile

          python3 - "$WORK/ft-arm64.aar" "$WORK/ft-armv7a.aar" "$WORK/aar" "$WORK" <<'PY'
          import sys, zipfile
          aar64, aar32, aarout, work = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          with zipfile.ZipFile(aar64) as z:
              z.extract("classes.jar", aarout)
              z.extract("jni/arm64-v8a/libgojni.so", work)
          with zipfile.ZipFile(aar32) as z:
              z.extract("jni/armeabi-v7a/libgojni.so", work)
          PY
          mkdir -p "$WORK/lib/arm64-v8a" "$WORK/lib/armeabi-v7a"
          cp "$WORK/jni/arm64-v8a/libgojni.so" "$WORK/lib/arm64-v8a/libgojni.so"
          cp "$WORK/jni/armeabi-v7a/libgojni.so" "$WORK/lib/armeabi-v7a/libgojni.so"

          find android/src -name '*.java' > "$WORK/sources.txt"
          javac -encoding UTF-8 --release 8 -Xlint:-options \
            -classpath "$AJAR:$WORK/aar/classes.jar" \
            -d "$WORK/classes" @"$WORK/sources.txt"

          find "$WORK/classes" -name '*.class' > "$WORK/classes.txt"
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 \
            --min-api 21 --lib "$AJAR" \
            --output "$WORK/dex" @"$WORK/classes.txt" "$WORK/aar/classes.jar"

          "$BT/aapt2" compile --dir android/res -o "$WORK/res.zip"
          VER_CODE=$((1000 + ${GITHUB_RUN_NUMBER:-0}))
          "$BT/aapt2" link -o "$WORK/base.apk" \
            --manifest android/AndroidManifest.xml \
            -I "$AJAR" --min-sdk-version 21 --target-sdk-version 34 \
            --version-code "$VER_CODE" --version-name "$VER_NAME" "$WORK/res.zip"

          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$WORK/release.keystore"
            KS="$WORK/release.keystore"
            ALIAS="${ANDROID_KEY_ALIAS:-ferry}"
            KSPASS="$ANDROID_KEYSTORE_PASS"
            KPASS="$ANDROID_KEY_PASS"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not configured; falling back to an ephemeral keystore."
            KS="$WORK/debug.keystore"
            ALIAS="androiddebugkey"
            KSPASS="android"
            KPASS="android"
            keytool -genkeypair -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KSPASS" -keypass "$KPASS" \
              -dname "CN=Ferry CI,O=Ferry,C=CN" >/dev/null 2>&1
          fi

          cp "$WORK/dex/classes.dex" "$WORK/classes.dex"

          for pair in "arm64:arm64-v8a" "armv7a:armeabi-v7a"; do
            arch="${pair%%:*}"
            abi="${pair##*:}"
            cp "$WORK/base.apk" "$WORK/base-${arch}.apk"
            (cd "$WORK" && python3 "$GITHUB_WORKSPACE/android/zipadd.py" "base-${arch}.apk" classes.dex=classes.dex "lib/${abi}/libgojni.so=lib/${abi}/libgojni.so")
            "$BT/zipalign" -f -p 4 "$WORK/base-${arch}.apk" "$WORK/aligned-${arch}.apk"
            java -jar "$BT/lib/apksigner.jar" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KSPASS" --key-pass "pass:$KPASS" \
              --out "$OUT/ferry-android-${arch}.apk" "$WORK/aligned-${arch}.apk"
            java -jar "$BT/lib/apksigner.jar" verify --print-certs "$OUT/ferry-android-${arch}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: out/android/*.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum ferry-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Generate Release Body
        run: |
          python3 tools/gen_release_body.py \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --changelog CHANGELOG.md \
            --assets-dir release-assets \
            --out /tmp/RELEASE_BODY.md
          cat /tmp/RELEASE_BODY.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s /tmp/RELEASE_BODY.md
          PRE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRE_ARGS=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/RELEASE_BODY.md \
              --draft=false
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --notes-file /tmp/RELEASE_BODY.md \
              "${PRE_ARGS[@]}"
          fi
