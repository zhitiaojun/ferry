<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>山径笔记 · 传输</title>
<style>
  :root{
    color-scheme: light dark;
    --paper:#F7F6F0; --paper-2:#F0EEE7; --paper-3:#E6E4DB;
    --ink:#16211C; --ink-2:#505955; --ink-3:#7E8783;
    --line:#D6D4CC; --line-soft:#E1E0D8;
    --accent:#2C5C49; --accent-ink:#FBFAF7; --accent-soft:#D6EDE2;
    --danger:#B64036; --amber:#915C08; --violet:#665189;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","SimSun",serif;
    --sans:system-ui,"Segoe UI","Microsoft YaHei UI",sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0E1411; --paper-2:#161E1A; --paper-3:#1E2823;
      --ink:#E8E6DF; --ink-2:#ABA9A1; --ink-3:#7E7C74;
      --line:#2B3430; --line-soft:#222A26;
      --accent:#89C7AB; --accent-ink:#111916; --accent-soft:#1B2F26;
      --danger:#ED8174; --amber:#E3B667; --violet:#BEA3DF;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);font-size:13px;line-height:19px;color:var(--ink);
       background:var(--paper);-webkit-font-smoothing:antialiased}
  .wrap{width:min(1080px,100% - 48px);margin:0 auto;padding:26px 0 48px}
  [hidden]{display:none!important}

  /* masthead */
  .sheet{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
         padding-bottom:14px;border-bottom:1px solid var(--line)}
  h1{font-family:var(--serif);font-weight:500;font-size:21px;line-height:28px;margin:0;letter-spacing:.02em}
  .sheet p{margin:6px 0 0;max-width:58ch;color:var(--ink-2);font-size:12px;line-height:17px}
  .state{display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap}
  #peer{font-family:var(--mono);font-size:11px;line-height:16px;letter-spacing:.04em;color:var(--ink-3)}
  #peer:empty{display:none}

  /* path stamp: colour + 1px border + word */
  .badge{display:inline-flex;align-items:center;gap:6px;height:18px;padding:0 6px;
         border:1px solid var(--line);border-radius:3px;font-family:var(--mono);
         font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;
         color:var(--ink-3);white-space:nowrap}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;
         border:1px solid currentColor;flex:none}
  .badge.lan{color:var(--accent);border-color:var(--accent)}
  .badge.relay{color:var(--violet);border-color:var(--violet)}
  .badge.failed{color:var(--danger);border-color:var(--danger)}
  .badge.lan::before,.badge.relay::before{border:0;background:currentColor;
         animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){
    .badge.lan::before,.badge.relay::before{animation:none}
  }

  /* sections */
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:26px 34px;margin-top:22px}
  h2{font-family:var(--mono);font-size:11px;line-height:16px;font-weight:500;
     letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
     margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  h2 span{letter-spacing:.06em;opacity:.72}

  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #code{flex:1 1 8em;min-width:0;font-family:var(--mono);font-size:13px;line-height:19px;
        letter-spacing:.24em;padding:8px 12px;border:1px solid var(--line);border-radius:6px;
        background:var(--paper-2);color:var(--ink)}
  #code::placeholder{font-family:var(--sans);letter-spacing:.02em;color:var(--ink-3)}
  #code:focus{outline:0;border-color:var(--accent);background:var(--paper)}
  .btn{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;
       background:var(--paper-2);color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--paper-3)}
  .btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.5;cursor:progress}

  .status{margin-top:10px;min-height:19px;font-size:12px;line-height:17px;
          color:var(--ink-2);white-space:pre-wrap}
  .status:empty::before{content:"输入 6 位码开始";color:var(--ink-3)}

  .race{list-style:none;margin:14px 0 0;padding:12px 0 0;
        border-top:1px solid var(--line-soft);display:grid;gap:6px}
  .race li{display:grid;grid-template-columns:8px 3.4em 1fr;align-items:center;gap:8px;
           font-size:12px;line-height:17px;color:var(--ink-2)}
  .race b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
          font-weight:500;color:var(--ink)}
  .mark{width:6px;height:6px;border-radius:50%;border:1px solid currentColor}
  .mark.lan{color:var(--accent);background:currentColor}
  .mark.relay{color:var(--violet);background:currentColor}

  .wait{margin:0;padding:9px 0 0;color:var(--ink-3);font-size:12px;line-height:17px}
  .panes section:has(#drop:not([hidden])) .wait{display:none}

  #drop{border:1px dashed var(--line);border-radius:7px;background:var(--paper-2);
        padding:22px 16px;text-align:center;color:var(--ink-2);font-size:12px;
        line-height:17px;cursor:pointer}
  #drop b{display:block;font-family:var(--serif);font-weight:500;font-size:16px;
          line-height:22px;color:var(--ink);margin-bottom:4px}
  #drop.over{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  #drop.over b{color:var(--accent)}
  #upload-row{margin-top:10px}
  input[type=file]{flex:1 1 12em;min-width:0;font:inherit;font-size:12px;color:var(--ink-2);
        border:1px solid var(--line);border-radius:6px;background:var(--paper-2);padding:6px 8px}
  input[type=file]::file-selector-button{font:inherit;font-size:12px;margin-right:10px;
        padding:4px 10px;border:1px solid var(--line);border-radius:5px;
        background:var(--paper);color:var(--ink);cursor:pointer}
  input[type=file]::file-selector-button:hover{background:var(--paper-3)}

  /* ledger */
  .ledger{margin-top:26px}
  table{width:100%;border-collapse:collapse}
  thead th{font-family:var(--mono);font-size:11px;line-height:16px;font-weight:500;
        letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;
        padding:0 10px 7px;border-bottom:1px solid var(--line)}
  thead th.n{text-align:right}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line-soft);
        font-size:13px;line-height:19px;vertical-align:middle}
  tbody tr:hover td{background:var(--paper-2)}
  tbody td:first-child{word-break:break-all}
  tbody td:nth-child(2){font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
        color:var(--ink-2);text-align:right;white-space:nowrap}
  tbody td:nth-child(3){font-family:var(--mono);font-size:11px;letter-spacing:.04em;
        color:var(--ink-3);white-space:nowrap}
  tbody td:last-child{text-align:right;white-space:nowrap}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
  a:hover{border-bottom-color:var(--accent)}
  tbody button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);
        border-radius:6px;background:var(--paper-2);color:var(--ink);cursor:pointer}
  tbody button:hover{border-color:var(--accent);color:var(--accent)}
  .empty{margin:0;padding:22px 12px 16px;text-align:center;color:var(--ink-3);
        font-size:12px;line-height:17px}
  #list:not([hidden]) + .empty{display:none}

  .foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line-soft);
        display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
        font-family:var(--mono);font-size:11px;line-height:16px;letter-spacing:.06em;
        text-transform:uppercase;color:var(--ink-3)}

  @media (max-width:720px){
    .wrap{width:min(1080px,100% - 32px);padding:20px 0 40px}
    .panes{grid-template-columns:1fr;gap:22px}
    .sheet{flex-direction:column;gap:12px}
    .state{flex-direction:row;align-items:center;gap:10px}
    h1{font-size:19px;line-height:26px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="sheet">
    <div>
      <h1>传文件</h1>
      <p>输入设备上显示的 6 位码。页面同时尝试局域网直连与服务器中继，先连通的那条生效。</p>
    </div>
    <div class="state">
      <span class="badge" id="mode">未连接</span>
      <span id="peer"></span>
    </div>
  </header>

  <div class="panes">
    <section>
      <h2>配对<span>PAIR</span></h2>
      <div class="row">
        <input id="code" maxlength="6" inputmode="numeric" placeholder="6 位码" autocomplete="one-time-code">
        <button id="go" class="btn primary">连接</button>
      </div>
      <div class="status" id="status"></div>
      <ul class="race">
        <li><span class="mark lan" aria-hidden="true"></span><b>LAN</b><span>同一局域网，毫秒级直连</span></li>
        <li><span class="mark relay" aria-hidden="true"></span><b>中继</b><span>打洞不通时由服务器转发</span></li>
      </ul>
    </section>

    <section>
      <h2>发送<span>SEND</span></h2>
      <p class="wait">连接设备后即可发送文件。</p>
      <div id="drop" hidden><b>把文件拖到这里</b>或点下面的按钮选择文件</div>
      <div class="row" id="upload-row" hidden>
        <input type="file" id="file" multiple>
        <button id="upload" class="btn primary">上传</button>
      </div>
    </section>
  </div>

  <section class="ledger">
    <h2>设备上的文件<span>FILES</span></h2>
    <table id="list" hidden>
      <thead><tr><th>文件</th><th class="n">大小</th><th>SHA-256</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="empty">还没有文件 · 连接设备后即可发送</p>
  </section>

  <footer class="foot">
    <span>ft · 浏览器端</span>
    <span>LAN 优先 · 中继兜底</span>
  </footer>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { base: null, mode: null, ws: null, room: null, files: [], get: null, put: null };

  function setMode(m, text) {
    var el = $('mode');
    el.className = 'badge ' + (m || '');
    el.textContent = m === 'lan' ? 'LAN' : m === 'relay' ? '中继' : '未连接';
    if (text) $('status').textContent = text;
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }

  function lanReady(base, ms) {
    return new Promise(function (resolve, reject) {
      var ctl = new AbortController();
      var t = setTimeout(function () { ctl.abort(); reject(new Error('lan timeout')); }, ms);
      fetch(base + '/api/list', { signal: ctl.signal, cache: 'no-store' })
        .then(function (r) {
          clearTimeout(t);
          if (!r.ok) throw new Error('lan ' + r.status);
          return r.json();
        })
        .then(function (j) { resolve({ base: base, files: j.files || [] }); })
        .catch(function (e) { clearTimeout(t); reject(e); });
    });
  }

  function relayConnect(room) {
    return new Promise(function (resolve, reject) {
      var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/web/' + room + '?role=guest';
      var ws = new WebSocket(url);
      var t = setTimeout(function () { try { ws.close(); } catch (e) {} reject(new Error('relay timeout')); }, 2500);
      ws.onopen = function () { clearTimeout(t); resolve(ws); };
      ws.onerror = function () { clearTimeout(t); reject(new Error('relay error')); };
    });
  }

  function connect() {
    var code = ($('code').value || '').trim();
    if (!/^\d{6}$/.test(code)) { $('status').textContent = '请输入 6 位数字码'; return; }
    $('go').disabled = true;
    setMode('', '正在查找设备…');
    fetch('/api/resolve?code=' + encodeURIComponent(code), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('码不正确或已过期'); return r.json(); })
      .then(function (info) {
        state.room = info.room;
        $('peer').textContent = info.name || '';
        var forceRelay = /[#&]relay=1/.test(location.hash || '');
        var lanAttempts = forceRelay ? [] : (info.lan || []).map(function (u) {
          return lanReady(u.replace(/\/$/, ''), 1200);
        });
        var relayAttempt = info.relay ? relayConnect(info.room).then(function (ws) {
          return { mode: 'relay', ws: ws };
        }) : null;
        if (!lanAttempts.length && !relayAttempt) throw new Error('设备没有可用的连接方式');
        // Both paths start together, but LAN wins whenever it answers inside
        // the window: a reachable LAN is always faster than the relay.
        var grace = new Promise(function (resolve) { setTimeout(resolve, 1200); });
        var first = lanAttempts.length
          ? Promise.race([Promise.any(lanAttempts).catch(function () { return null; }), grace])
          : Promise.resolve(null);
        return first.then(function (lan) {
          if (lan) return lan;
          if (relayAttempt) return relayAttempt;
          throw new Error('局域网与中继都没连上');
        });
      })
      .then(function (win) {
        if (win.ws) {
          state.mode = 'relay'; state.ws = win.ws;
          state.files = [];
          wireRelay(win.ws);
          setMode('relay', '已通过服务器中继连接');
          $('go').disabled = false;
          $('upload-row').hidden = false;
          $('drop').hidden = false;
          relayList();
          return;
        }
        state.mode = 'lan'; state.base = win.base;
        setMode('lan', '已直连设备，速度取决于局域网');
        $('go').disabled = false;
        $('upload-row').hidden = false;
        $('drop').hidden = false;
        render(win.files);
      })
      .catch(function (e) {
        $('go').disabled = false;
        setMode('', '连接失败：' + (e && e.message ? e.message : e));
      });
  }

  function render(files) {
    var tb = document.querySelector('#list tbody');
    tb.innerHTML = '';
    files.forEach(function (f) {
      var tr = document.createElement('tr');
      var name = document.createElement('td'); name.textContent = f.name;
      var size = document.createElement('td'); size.textContent = fmtSize(f.size);
      var sha = document.createElement('td'); sha.textContent = (f.sha256 || '').slice(0, 12) + '…';
      var act = document.createElement('td');
      if (state.mode === 'relay') {
        var btn = document.createElement('button');
        btn.textContent = '下载';
        btn.onclick = function () { relayDownload(f.name); };
        act.appendChild(btn);
      } else {
        var a = document.createElement('a');
        a.href = state.base + '/f/' + encodeURIComponent(f.name);
        a.textContent = '下载';
        act.appendChild(a);
      }
      tr.appendChild(name); tr.appendChild(size); tr.appendChild(sha); tr.appendChild(act);
      tb.appendChild(tr);
    });
    $('list').hidden = files.length === 0;
  }

  function refresh() {
    if (state.mode === 'relay') return relayList();
    if (!state.base) return;
    fetch(state.base + '/api/list', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.files || []); });
  }

  function upload(files) {
    if (state.mode === 'relay') { relayUploadAll(files); return; }
    if (!state.base || !files.length) return;
    var fd = new FormData();
    for (var i = 0; i < files.length; i++) fd.append('file', files[i], files[i].name);
    $('status').textContent = '上传中…';
    fetch(state.base + '/upload', { method: 'POST', body: fd })
      .then(function (r) { if (!r.ok) throw new Error('upload ' + r.status); return r.json(); })
      .then(function () { $('status').textContent = '上传完成'; refresh(); })
      .catch(function (e) { $('status').textContent = '上传失败：' + e.message; });
  }


  function relaySend(obj) {
    if (!state.ws) return;
    state.ws.send(JSON.stringify(obj));
  }

  function sha256Hex(buf) {
    return crypto.subtle.digest('SHA-256', buf).then(function (d) {
      return Array.from(new Uint8Array(d)).map(function (x) {
        return x.toString(16).padStart(2, '0');
      }).join('');
    });
  }

  function wireRelay(ws) {
    ws.binaryType = 'arraybuffer';
    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') { relayControl(ev.data); return; }
      if (state.get) { state.get.chunks.push(ev.data); state.get.have += ev.data.byteLength; }
    };
    ws.onclose = function () {
      if (state.mode === 'relay') { setMode('', '中继连接已断开'); }
    };
  }

  function relayControl(text) {
    var msg;
    try { msg = JSON.parse(text); } catch (e) { return; }
    if (msg.t === 'files') { render(msg.files || []); return; }
    if (msg.t === 'get.begin') {
      state.get = { name: msg.name, size: msg.size, chunks: [], have: 0 };
      $('status').textContent = '下载中：' + msg.name;
      return;
    }
    if (msg.t === 'get.end') {
      var g = state.get; state.get = null;
      if (!g) return;
      var blob = new Blob(g.chunks);
      blob.arrayBuffer().then(function (buf) {
        return sha256Hex(buf).then(function (h) {
          $('status').textContent = '下载完成：' + g.name + '（' + fmtSize(buf.byteLength) + '）' +
            (msg.sha256 && msg.sha256 !== h ? '，哈希不一致！' : '，哈希校验通过');
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = g.name; document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
        });
      });
      return;
    }
    if (msg.t === 'put.ready') {
      if (state.put) { state.put.name = msg.name; pumpPut(); }
      return;
    }
    if (msg.t === 'put.ok') {
      state.put = null;
      $('status').textContent = '上传完成：' + msg.name + '，SHA-256 ' + msg.sha256.slice(0, 12) + '…';
      relayList();
      return;
    }
    if (msg.t === 'err') { $('status').textContent = '传输失败：' + msg.msg; }
  }

  function relayList() {
    relaySend({ t: 'list' });
  }

  function relayDownload(name) {
    if (!state.ws) return;
    $('status').textContent = '请求下载：' + name;
    relaySend({ t: 'get', name: name });
  }

  function relayUploadAll(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length || !state.ws) return;
    var next = function () {
      var f = list.shift();
      if (!f) { $('status').textContent = '全部上传完成'; return; }
      startPut(f);
    };
    state.putNext = next;
    next();
  }

  function startPut(file) {
    file.arrayBuffer().then(function (buf) {
      state.put = { file: file, buf: buf, off: 0, name: null };
      $('status').textContent = '上传中：' + file.name;
      relaySend({ t: 'put.begin', name: file.name, size: file.size });
    });
  }

  function pumpPut() {
    var p = state.put;
    if (!p) return;
    var CH = 64 * 1024;
    var HIGH_WATER = 4 * 1024 * 1024;
    // Send fixed bursts, then yield to the event loop. A pure microtask chain
    // starves rendering (and the browser tooling), while a bare setTimeout(0)
    // between every 64 KiB frame is throttled to ~1 s per chunk in background
    // tabs; bursting keeps both fast and responsive.
    var BURST = 32;
    var step = function () {
      if (!state.put) return;
      var sent = 0;
      while (p.off < p.buf.byteLength && state.ws.bufferedAmount < HIGH_WATER && sent < BURST) {
        var end = Math.min(p.off + CH, p.buf.byteLength);
        state.ws.send(p.buf.slice(p.off, end));
        p.off = end;
        sent++;
        $('status').textContent = '上传中：' + p.name + ' ' + Math.round(p.off * 100 / p.buf.byteLength) + '%';
      }
      if (p.off < p.buf.byteLength) { setTimeout(step, 0); return; }
      relaySend({ t: 'put.end' });
    };
    step();
  }

  var m = /[#&]code=(\d{6})/.exec(location.hash || '');
  if (m) $('code').value = m[1];

  $('go').addEventListener('click', connect);
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(); });
  $('upload').addEventListener('click', function () { upload($('file').files); });
  ['dragenter', 'dragover'].forEach(function (t) {
    $('drop').addEventListener(t, function (e) { e.preventDefault(); $('drop').classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    $('drop').addEventListener(t, function (e) { e.preventDefault(); $('drop').classList.remove('over'); });
  });
  $('drop').addEventListener('drop', function (e) { upload(e.dataTransfer.files); });
})();
</script>
</body>
</html>
