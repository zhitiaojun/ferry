<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ft · 界面方案 A（仪表台账）</title>
<style>
  :root{
    color-scheme: light dark;
    --paper:      light-dark(oklch(0.972 0.008 95),  oklch(0.185 0.012 165));
    --paper-2:    light-dark(oklch(0.949 0.010 95),  oklch(0.225 0.014 165));
    --paper-3:    light-dark(oklch(0.918 0.012 95),  oklch(0.265 0.016 165));
    --ink:        light-dark(oklch(0.235 0.018 165), oklch(0.925 0.010 95));
    --ink-2:      light-dark(oklch(0.455 0.014 165), oklch(0.735 0.012 95));
    --ink-3:      light-dark(oklch(0.615 0.012 165), oklch(0.585 0.012 95));
    --line:       light-dark(oklch(0.870 0.012 95),  oklch(0.315 0.014 165));
    --line-soft:  light-dark(oklch(0.905 0.010 95),  oklch(0.275 0.012 165));
    --accent:     light-dark(oklch(0.435 0.062 165), oklch(0.780 0.075 165));
    --accent-ink: light-dark(oklch(0.985 0.004 95),  oklch(0.205 0.014 165));
    --accent-soft:light-dark(oklch(0.925 0.028 165), oklch(0.285 0.030 165));
    --danger:     light-dark(oklch(0.535 0.155 28),  oklch(0.720 0.135 28));
    --serif: "Iowan Old Style","Palatino Linotype","Songti SC","SimSun",serif;
    --sans: "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    --mono: "Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
    --t-xs: clamp(10px, 0.62rem + 0.12vw, 11.5px);
    --t-sm: clamp(11.5px, 0.7rem + 0.16vw, 13px);
    --t-md: clamp(13px, 0.78rem + 0.2vw, 15px);
    --t-lg: clamp(16px, 0.95rem + 0.5vw, 21px);
    --t-xl: clamp(22px, 1.2rem + 1vw, 34px);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--paper-3);
    background-image:radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0);
    background-size:22px 22px;
    padding:clamp(20px,3vw,44px);
    display:flex; flex-direction:column; gap:clamp(20px,3vw,36px);
  }
  header.sheet{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); padding-bottom:14px}
  .sheet h1{font-family:var(--serif); font-weight:500; font-size:var(--t-xl); margin:0; letter-spacing:.01em}
  .sheet h1 span{color:var(--accent)}
  .sheet p{margin:6px 0 0; color:var(--ink-2); font-size:var(--t-sm); max-width:62ch}
  .sheet .meta{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3); text-align:right; line-height:1.7; white-space:nowrap}
  .toggle{font:inherit; font-size:var(--t-sm); padding:7px 12px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px; cursor:pointer}
  .toggle:hover{background:var(--paper-2)}

  .stage{display:flex; flex-wrap:wrap; gap:clamp(18px,2.4vw,34px); align-items:flex-start}
  figure{margin:0; display:flex; flex-direction:column; gap:10px}
  figcaption{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase}
  figcaption b{color:var(--ink-2); font-weight:600; letter-spacing:0}

  /* ---------- window chrome ---------- */
  .win{background:var(--paper); border:1px solid var(--line); border-radius:9px; overflow:hidden;
       box-shadow:0 1px 0 light-dark(oklch(1 0 0/.6), oklch(0 0 0/.3)) , 0 18px 44px -28px oklch(0.2 0.03 165/.45)}
  .win.is-main{width:880px; height:520px; display:flex; flex-direction:column}
  .tbar{height:32px; display:flex; align-items:center; gap:10px; padding:0 12px; border-bottom:1px solid var(--line-soft); background:var(--paper-2)}
  .tbar .tl{font-family:var(--serif); font-size:13px; letter-spacing:.04em; color:var(--ink-2)}
  .tbar .tl b{color:var(--ink); font-weight:600}
  .tbar .sp{flex:1}
  .tbar .glyph{width:26px; height:22px; display:grid; place-items:center; color:var(--ink-3); font-family:var(--mono); font-size:12px}
  .tbar .glyph:hover{background:var(--paper-3); color:var(--ink)}

  /* ---------- main window ---------- */
  .main{flex:1; display:grid; grid-template-columns:206px 1fr; min-height:0}
  .side{border-right:1px solid var(--line-soft); display:flex; flex-direction:column; padding:14px 0 12px}
  .side h2, .pane h2{font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin:0 14px 10px; font-weight:500; display:flex; justify-content:space-between}
  .side h2 em{font-style:normal; color:var(--accent)}
  .peers{list-style:none; margin:0; padding:0; overflow:auto}
  .peer{display:grid; grid-template-columns:16px 1fr auto; gap:0 9px; align-items:baseline; padding:8px 14px 8px 12px; cursor:default; border-left:2px solid transparent; position:relative}
  .peer:hover{background:var(--paper-2)}
  .peer[aria-selected="true"]{border-left-color:var(--accent); background:var(--accent-soft)}
  .peer .idx{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
  .peer .nm{font-size:var(--t-md); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .peer .id{grid-column:2/4; font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3); letter-spacing:.02em}
  .peer .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);align-self:center}
  .peer.off .dot{background:var(--ink-3)}
  .side .foot{margin-top:auto; padding:10px 14px 0; border-top:1px solid var(--line-soft); font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3); display:flex; justify-content:space-between}

  .pane{display:flex; flex-direction:column; min-height:0; padding:14px}
  .dropzone{border:1px dashed var(--line); border-radius:7px; padding:14px 16px; display:flex; align-items:center; gap:16px; background:var(--paper-2)}
  .dropzone .big{font-family:var(--serif); font-size:var(--t-lg); letter-spacing:.02em}
  .dropzone .hint{font-size:var(--t-sm); color:var(--ink-2)}
  .dropzone .sp{flex:1}
  .btn{font:inherit; font-size:var(--t-sm); padding:7px 13px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer}
  .btn:hover{background:var(--paper-3)}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .btn.primary:hover{filter:brightness(1.05)}

  .ledger{margin-top:14px; display:flex; flex-direction:column; min-height:0}
  .ledger table{width:100%; border-collapse:collapse; font-size:var(--t-sm)}
  .ledger thead th{font-family:var(--mono); font-weight:500; font-size:var(--t-xs); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); text-align:left; padding:0 8px 7px; border-bottom:1px solid var(--line)}
  .ledger tbody td{padding:8px; border-bottom:1px solid var(--line-soft); vertical-align:baseline; white-space:nowrap}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .dim{color:var(--ink-3)}
  .file{display:flex; gap:7px; align-items:baseline}
  .file .sub{font-size:var(--t-xs); color:var(--ink-3)}
  .dir{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-2)}
  .stamp{display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.08em; text-transform:uppercase;
         border:1px solid currentColor; border-radius:3px; padding:1px 6px; line-height:1.5; opacity:.92}
  .stamp.lan{color:var(--accent)} .stamp.punch{color:light-dark(oklch(0.48 0.10 250), oklch(0.78 0.09 250))}
  .stamp.relay{color:light-dark(oklch(0.50 0.09 60), oklch(0.80 0.09 75))}
  .stamp.err{color:var(--danger)}
  .stamp::before{content:""; width:5px;height:5px;border-radius:50%;background:currentColor}
  .rowhover tbody tr:hover{background:var(--paper-2)}
  .statusline{margin-top:auto; padding-top:10px; border-top:1px solid var(--line-soft); display:flex; align-items:center; gap:14px; font-size:var(--t-sm); color:var(--ink-2)}
  .statusline .sp{flex:1}
  .pill{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:var(--t-xs); border:1px solid var(--line); border-radius:999px; padding:3px 9px; color:var(--ink-2)}
  .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 0 var(--accent); animation:breathe 2.4s ease-out infinite}
  @keyframes breathe{0%{box-shadow:0 0 0 0 color-mix(in oklch, var(--accent) 45%, transparent)} 70%{box-shadow:0 0 0 7px transparent} 100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion: reduce){ .pulse{animation:none} }

  /* ---------- desktop backdrop for panel ---------- */
  .desk{width:520px; height:436px; border-radius:10px; overflow:hidden; position:relative; border:1px solid var(--line);
        background:
          radial-gradient(120% 90% at 78% 12%, oklch(0.42 0.06 210/.55), transparent 60%),
          radial-gradient(90% 80% at 18% 88%, oklch(0.34 0.07 160/.55), transparent 62%),
          linear-gradient(155deg, oklch(0.235 0.03 220), oklch(0.16 0.02 190));
        box-shadow:0 1px 0 light-dark(oklch(1 0 0/.35), oklch(0 0 0/.4)), 0 24px 60px -34px oklch(0.2 0.03 190/.7)}
  .desk .ic{position:absolute; display:grid; gap:6px; justify-items:center; color:oklch(0.93 0.01 95); font-family:var(--sans); font-size:11px; width:76px; text-align:center; opacity:.9}
  .desk .ic .sheet{width:34px;height:42px;border-radius:3px;background:oklch(0.95 0.01 95/.92); box-shadow:0 2px 6px oklch(0 0 0/.35)}
  .desk .ic.sel .sheet{outline:2px solid oklch(0.72 0.08 165); outline-offset:2px}
  .desk .ic.sel .nm{background:oklch(0.72 0.08 165/.28); border-radius:3px; padding:0 4px}
  .desk .ghost{position:absolute; left:296px; top:96px; width:120px; height:34px; border-radius:4px; background:oklch(0.96 0.01 95/.35);
        border:1px solid oklch(1 0 0/.55); backdrop-filter:blur(1px); display:grid; place-items:center; color:oklch(0.18 0.01 200); font-family:var(--mono); font-size:10px}

  /* ---------- drop panel ---------- */
  .panel{position:absolute; left:120px; top:150px; width:360px; height:260px; background:var(--paper); border:1px solid var(--line); border-radius:11px;
        box-shadow:0 26px 60px -30px oklch(0.15 0.02 200/.75); display:flex; flex-direction:column; overflow:hidden}
  .panel .ph{display:flex; align-items:center; gap:8px; padding:10px 12px 8px; border-bottom:1px solid var(--line-soft); font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
  .panel .ph .sp{flex:1}
  .panel .ph kbd{font:inherit; border:1px solid var(--line); border-radius:3px; padding:0 4px; letter-spacing:0; text-transform:none; color:var(--ink-3)}
  .chips{display:flex; gap:6px; padding:10px 12px 0; flex-wrap:wrap}
  .chip{font:inherit; font-size:var(--t-sm); padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink-2); cursor:pointer; display:inline-flex; gap:6px; align-items:center}
  .chip:hover{background:var(--paper-2)}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:transparent; color:var(--accent-ink)}
  .chip .d{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
  .panel .body{flex:1; margin:10px 12px 0; border:1px dashed var(--line); border-radius:8px; display:grid; place-items:center; text-align:center; background:var(--paper-2)}
  .panel .body .h{font-family:var(--serif); font-size:20px; letter-spacing:.02em}
  .panel .body .s{font-size:var(--t-sm); color:var(--ink-2); margin-top:4px}
  .panel .body .f{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3); margin-top:10px}
  .panel .pf{display:flex; align-items:center; gap:8px; padding:9px 12px; border-top:1px solid var(--line-soft); font-size:var(--t-xs); color:var(--ink-3); font-family:var(--mono)}

  /* ---------- progress strip ---------- */
  .strip{width:320px; height:56px; background:var(--paper); border:1px solid var(--line); border-radius:9px; box-shadow:0 18px 40px -26px oklch(0.15 0.02 200/.6); display:flex; align-items:center; gap:10px; padding:0 12px}
  .strip .ring{width:22px;height:22px;border-radius:50%; background:conic-gradient(var(--accent) 46%, var(--paper-3) 0); position:relative; flex:none}
  .strip .ring::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--paper)}
  .strip .nm{font-size:var(--t-sm); display:flex; flex-direction:column; gap:3px; min-width:0}
  .strip .nm b{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .strip .nm i{font-style:normal; font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3)}
  .strip .sp{flex:1}
  .strip .x{width:22px;height:22px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:4px;font-size:13px}
  .strip .x:hover{background:var(--paper-2); color:var(--ink)}

  /* ---------- phone ---------- */
  .phone{width:390px; height:844px; border-radius:34px; border:1px solid var(--line); background:var(--paper); overflow:hidden; position:relative;
         box-shadow:0 30px 70px -40px oklch(0.15 0.02 200/.5)}
  .phone .notch{position:absolute; top:9px; left:50%; translate:-50% 0; width:74px; height:5px; border-radius:99px; background:var(--line)}
  .phone .inner{padding:44px 18px 18px; display:flex; flex-direction:column; gap:16px; height:100%}
  .ph-head{display:flex; align-items:baseline; justify-content:space-between}
  .ph-head .n{font-family:var(--serif); font-size:22px}
  .ph-head .id{font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
  .recv{margin-top:4px; border:1px solid var(--line); border-radius:16px; padding:18px; background:var(--paper-2); display:flex; align-items:center; gap:16px}
  .recv .orb{width:64px;height:64px;border-radius:50%; background:var(--accent-soft); display:grid; place-items:center; position:relative; flex:none}
  .recv .orb::before{content:""; position:absolute; inset:-4px; border-radius:50%; border:1px solid var(--accent); opacity:.35; animation:breathe 2.6s ease-out infinite}
  .recv .orb i{width:18px;height:18px;border:2px solid var(--accent); border-radius:50%; border-top-color:transparent; transform:rotate(45deg)}
  .recv .t{display:flex; flex-direction:column; gap:3px}
  .recv .t b{font-size:var(--t-md); font-weight:600}
  .recv .t span{font-size:var(--t-xs); color:var(--ink-2); font-family:var(--mono)}
  .ph-sec{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); display:flex; justify-content:space-between; margin-top:2px}
  .ph-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px}
  .ph-list li{display:grid; grid-template-columns:1fr auto; column-gap:10px; row-gap:3px; padding:11px 2px; border-bottom:1px solid var(--line-soft); align-items:baseline}
  .ph-list .l1{grid-column:1; grid-row:1; font-size:var(--t-sm)}
  .ph-list .l2{grid-column:1; grid-row:2; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
  .ph-list .r{grid-column:2; grid-row:1; justify-self:end}
  .ph-cta{margin-top:auto; display:grid; gap:8px}
  .ph-cta .btn{padding:11px; font-size:var(--t-md)}


  .tokens .tokcard{width:420px; background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:16px 18px; display:flex; flex-direction:column; gap:14px; box-shadow:0 18px 44px -30px oklch(0.2 0.03 165/.4)}
  .tokens h3{margin:0; font-family:var(--mono); font-size:var(--t-xs); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
  .tokens .sw{display:flex; gap:10px}
  .tokens .sw span{flex:1; display:flex; flex-direction:column; gap:6px; font-size:var(--t-xs); color:var(--ink-2)}
  .tokens .sw span::before{content:""; height:34px; border-radius:5px; background:var(--c); border:1px solid var(--line)}
  .tokens .ts{display:flex; flex-direction:column; gap:8px}
  .tokens .ts>div{display:flex; align-items:baseline; gap:12px; border-bottom:1px dotted var(--line); padding-bottom:6px}
  .tokens .k{font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3); width:32px; flex:none}
  .tokens .rules{margin:0; padding-left:16px; font-size:var(--t-sm); color:var(--ink-2); display:flex; flex-direction:column; gap:6px}
  .note{font-size:var(--t-sm); color:var(--ink-2); max-width:70ch; border-left:2px solid var(--accent); padding-left:12px}
  .note b{color:var(--ink)}
</style>
</head>
<body>
<header class="sheet">
  <div>
    <h1>ft <span>·</span> 文件传递 — 界面方案 A「仪表台账」</h1>
    <p>两个界面：主界面管设备与台账，投放面板只在拖动文件时出现。数字用等宽、路径用印章、分隔用发丝线；除传输中的呼吸点外没有动效。</p>
  </div>
  <div class="meta">
    方案 A / 2026-11-09<br>
    <button class="toggle" id="tg">切换深色</button>
  </div>
</header>

<section class="stage">
  <figure>
    <div class="win is-main" role="img" aria-label="主界面 880×520">
      <div class="tbar"><span class="tl"><b>ft</b> · 文件传递</span><span class="sp"></span><span class="glyph">–</span><span class="glyph">×</span></div>
      <div class="main">
        <aside class="side">
          <h2>设备 <em>03</em></h2>
          <ul class="peers">
            <li class="peer" aria-selected="true"><span class="idx">01</span><span class="nm">HyperX（本机）</span><span class="dot"></span><span class="id">9169…2c8b · 18820</span></li>
            <li class="peer"><span class="idx">02</span><span class="nm">android-M332BF</span><span class="dot"></span><span class="id">c6d7…9313 · 2 分钟前</span></li>
            <li class="peer off"><span class="idx">03</span><span class="nm">MacBook Pro</span><span class="dot"></span><span class="id">0b9f…4712 · 昨天</span></li>
          </ul>
          <div class="foot"><span>已配对 3</span><span>0.8.0</span></div>
        </aside>
        <div class="pane">
          <h2>发送</h2>
          <div class="dropzone">
            <div>
              <div class="big">拖文件到这里</div>
              <div class="hint">或选择文件，自动在 LAN / 打洞 / 中继中并发择优</div>
            </div>
            <span class="sp"></span>
            <button class="btn">选择文件…</button>
            <button class="btn primary">发送到 android-M332BF</button>
          </div>
          <h2 style="margin-top:16px">最近传输 <em style="font-style:normal;color:var(--ink-3)">04</em></h2>
          <div class="ledger rowhover">
            <table>
              <thead><tr><th>时间</th><th>方向</th><th>对端</th><th>文件</th><th style="text-align:right">大小</th><th style="text-align:right">用时</th><th>路径</th></tr></thead>
              <tbody>
                <tr><td class="num dim">23:12</td><td class="dir">↑</td><td>android-M332BF</td><td><div class="file"><span>test-2.1m.bin</span></div></td><td class="num" style="text-align:right">2.1 MB</td><td class="num" style="text-align:right">12 ms</td><td><span class="stamp lan">LAN</span></td></tr>
                <tr><td class="num dim">22:58</td><td class="dir">↓</td><td>MacBook Pro</td><td><div class="file"><span>IMG_2841.HEIC</span></div></td><td class="num" style="text-align:right">10.0 MB</td><td class="num" style="text-align:right">2.1 s</td><td><span class="stamp punch">打洞</span></td></tr>
                <tr><td class="num dim">21:04</td><td class="dir">↑</td><td>android-M332BF</td><td><div class="file"><span>report.pdf</span><span class="sub">+1</span></div></td><td class="num" style="text-align:right">10.0 MB</td><td class="num" style="text-align:right">3.1 s</td><td><span class="stamp relay">中继</span></td></tr>
                <tr><td class="num dim">20:31</td><td class="dir">↑</td><td>MacBook Pro</td><td><div class="file"><span>video.mp4</span><span class="sub">失败</span></div></td><td class="num dim" style="text-align:right">200 MB</td><td class="num dim" style="text-align:right">—</td><td><span class="stamp err" title="对端未配对：先在两台设备上用 6 位码配对">未配对</span></td></tr>
              </tbody>
            </table>
          </div>
          <div class="statusline">
            <span class="pill"><span class="pulse"></span>接收中 · :18820</span>
            <span class="dim">中继空闲</span>
            <span class="sp"></span>
            <button class="btn">打开接收目录</button>
            <button class="btn">暂停接收</button>
          </div>
        </div>

<script>
  const tg = document.getElementById('tg');

  tg.addEventListener('click', () => {

    root.style.colorScheme = dark ? 'light' : 'dark';
    tg.textContent = dark ? '切换深色' : '切换浅色';
